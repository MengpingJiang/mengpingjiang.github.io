{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
           <a href="{{ base_path }}/" class="lab-title">
           <svg class="lab-logo lab-brain" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 40C2 37 2 28 7 24 4 16 11 10 17 11 20 3 29 3 34 8 42 4 48 10 49 15 59 16 63 26 57 33 60 42 52 47 44 45L39 51 34 43H20C15 46 10 45 11 40Z"/><path d="M17 11c-2 7 1 11 7 12m10-15c-6 4-7 10-3 14m18-7c-7-2-13 3-12 9M7 24c5-2 11 1 11 7m6-8c7-2 12 2 12 9m21 1c-5-4-12-2-14 4M11 40c6-1 10-5 9-10m14 13c-6-4-7-9-4-13m14 15c1-4 4-6 8-6"/></g></svg>

            <span>
             JIANG LAB<br>
             <small>Social &amp; Computational Neuroscience</small>
           </span>
           </a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" tabindex="0" aria-label="Toggle light or dark theme" title="Toggle light or dark theme"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
